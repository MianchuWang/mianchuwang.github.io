<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mianchu Wang</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✳️</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github.min.css" media="(prefers-color-scheme: light)" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.10.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)" />
  <link rel="stylesheet" href="assets/style.css" />
  <script>
    const t = localStorage.getItem("theme");
    if (t) document.documentElement.dataset.theme = t;
    // Sync highlight.js theme with explicit theme choice.
    addEventListener("DOMContentLoaded", () => {
      const sync = () => {
        const theme = document.documentElement.dataset.theme;
        const light = document.querySelector('link[href*="github.min.css"]');
        const dark = document.querySelector('link[href*="github-dark.min.css"]');
        if (!theme) {
          light.media = "(prefers-color-scheme: light)";
          dark.media = "(prefers-color-scheme: dark)";
        } else {
          light.media = theme === "light" ? "all" : "not all";
          dark.media = theme === "dark" ? "all" : "not all";
        }
      };
      sync();
      new MutationObserver(sync).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["data-theme"],
      });
    });
  </script>
</head>
<body>
  <div class="page">
    <nav class="site-nav">
      <a class="brand" href="./">Mianchu Wang</a>
      <div class="nav-right">
        <button class="theme-toggle" title="Toggle theme" aria-label="Toggle theme">☾</button>
      </div>
    </nav>

    <a class="back-link" href="./">← Back</a>

    <article>
      <header class="article-header">
        <h1 id="article-title"></h1>
        <div class="article-meta" id="article-meta"></div>
      </header>
      <div class="article-body" id="article-body">
        <div class="loading">Loading…</div>
      </div>
    </article>

    <footer class="site-footer">
      <span>© 2026 Mianchu Wang</span>
      <span><a href="./">mianchuwang.github.io</a></span>
    </footer>
  </div>

  <nav class="toc" id="toc" aria-label="Table of contents"></nav>

  <script type="module" src="assets/post.js"></script>
</body>
</html>
