<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>try{const _t=localStorage.getItem("theme");if(_t)document.documentElement.dataset.theme=_t;}catch(e){}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Build a Transformer in 150 Minutes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="css/style.css?v=bt11">
</head>
<body>
  <div class="container container-wide">
    <a href="./" class="back-link">All components</a>

    <header class="lab-header">
      <h1 id="title">Loading…</h1>
      <span class="badge hidden" id="difficulty"></span>
      <span class="lab-timer hidden" id="timer" title="Suggested time — informational only"></span>
      <nav class="lab-nav">
        <a id="prev-link" class="disabled">&#8592; Previous</a>
        <a id="next-link" class="disabled">Next &#8594;</a>
      </nav>
    </header>

    <div class="lab-cols">
      <section class="pane pane-brief" id="brief">Loading…</section>

      <section class="pane pane-editor">
        <div class="toolbar">
          <span class="status" id="status">Starting…</span>
          <span class="kbd-hint"><kbd>&#8984;</kbd>/<kbd>Ctrl</kbd> + <kbd>Enter</kbd> to run</span>
          <span class="toolbar-right">
            <button class="btn btn-secondary" id="reset-btn" type="button">Reset</button>
            <button class="btn btn-primary" id="run-btn" type="button" disabled>Run tests</button>
          </span>
        </div>

        <div class="editor-wrap">
          <textarea id="editor" class="editor-fallback" spellcheck="false"></textarea>
        </div>

        <div class="output" id="output">
          <p class="output-empty">Write the function, then run the tests.</p>
        </div>
      </section>
    </div>

    <footer class="site-footer">
      <p>Python runs in your browser via Pyodide &middot; <code>numpy</code>,
        <code>einops</code>, <code>jaxtyping</code> and <code>beartype</code> are available
        &middot; your code is saved locally</p>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script type="module" src="js/lab.js?v=bt11"></script>
</body>
</html>
