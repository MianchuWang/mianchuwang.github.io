<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS336 Quiz</title>
  <link rel="stylesheet" href="css/style.css?v=study3">
</head>
<body>
  <div class="container">
    <header class="site-header">
      <a href="../../" class="back-link">Mianchu Wang</a>
      <h1>CS336 Quiz</h1>
      <p class="subtitle">Self-test and review for Stanford CS336: Language Modeling from Scratch</p>
    </header>

    <main>
      <div id="lecture-list" class="lecture-list"></div>
    </main>

    <footer class="site-footer">
      <p>Built for personal study &middot; Questions based on the CS336 lecture series</p>
    </footer>
  </div>

  <script src="data/lectures.js?v=study2"></script>
  <script>
    // Compact view: one row per lecture, its quizzes as inline links.
    // Quiz titles follow "Topic — Variant"; descriptions become tooltips.
    const list = document.getElementById('lecture-list');
    const groups = new Map();
    window.LECTURES.forEach(lec => {
      if (!groups.has(lec.tag)) groups.set(lec.tag, []);
      groups.get(lec.tag).push(lec);
    });
    groups.forEach((quizzes, tag) => {
      const parts = quizzes[0].title.split('—');
      const topic = parts[0].trim();
      const row = document.createElement('div');
      row.className = 'lecture-row';
      const links = quizzes.map(q => {
        const variant = (q.title.split('—')[1] || 'Quiz').trim();
        const tip = q.description + ' (' + q.questionCount + ' questions)';
        return '<a class="quiz-link" href="quiz.html?lecture=' + encodeURIComponent(q.id) +
               '" title="' + tip.replace(/"/g, '&quot;') + '">' + variant + '</a>';
      }).join('');
      row.innerHTML =
        '<span class="lecture-row-tag">' + tag + '</span>' +
        '<span class="lecture-row-topic">' + topic + '</span>' +
        '<span class="quiz-links">' + links + '</span>';
      list.appendChild(row);
    });
  </script>
</body>
</html>
